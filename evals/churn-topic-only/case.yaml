schema_version: "1.1"
name: churn-topic-only
expected_outcome: |
  With the user unavailable, the run does not stop to ask. It shortlists several real companies for customer churn, measures each one's public data footprint, takes the recommended company and default details and says so, collects that company's data across several layers (financial or operating KPIs, regulator or customer records, peers), structures it, classifies provenance, and plans all four analytics stages against the collected data, ending with a feasibility verdict.
